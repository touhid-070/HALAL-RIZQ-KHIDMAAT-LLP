services:
  - type: web
    name: halal-rizq-khidmaat
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: halal-rizq-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/halal.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
