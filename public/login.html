<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member login | Halal Rizq Khidmaat LLP</title>
<meta name="description" content="Log in to apply for and manage Halal certification.">
<link rel="icon" href="/images/logo.jpeg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="panel">
  <h1>Member login</h1>
  <form id="auth-form" data-endpoint="/api/auth/login">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <div id="auth-msg" class="alert error hidden" role="alert"></div>
    <p><button class="btn" type="submit">Log in</button></p>
  </form>
  <p>New here? <a href="/register">Create an account</a></p>
</div>
</main>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
