<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track a certificate | Halal Rizq Khidmaat LLP</title>
<meta name="description" content="Track and verify a Halal certificate by number, Sr. No. or QR code.">
<link rel="icon" href="/images/logo.jpeg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="panel">
  <h1>Track a Halal certificate</h1>
  <form id="track-form">
    <label for="track-q">Certificate number or Sr. No.</label>
    <input id="track-q" placeholder="HRK-2026-00001" required>
    <div id="track-msg" class="alert error hidden" role="alert"></div>
    <p><button class="btn" type="submit">Track</button></p>
  </form>
  <p>You can also scan the QR code on the certificate with your phone camera.</p>
</div>
</main>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/track.js"></script>
</body>
</html>
