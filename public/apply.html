<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for Halal certification | Halal Rizq Khidmaat LLP</title>
<meta name="description" content="Apply online for Halal certification.">
<link rel="icon" href="/images/logo.jpeg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="panel wide">
  <h1>Apply for Halal certification</h1>
  <form id="apply-form">
    <label for="business_name">Business name (as it should appear on the certificate)</label>
    <input id="business_name" name="business_name" required>
    <div class="row">
      <div><label for="owner_name">Owner / contact person</label><input id="owner_name" name="owner_name" required></div>
      <div><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" required></div>
    </div>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="address">Business address</label><textarea id="address" name="address" rows="2" required></textarea>
    <div class="row">
      <div><label for="city">City</label><input id="city" name="city" required></div>
      <div><label for="state">State</label><input id="state" name="state" required></div>
    </div>
    <div class="row">
      <div><label for="pincode">Pincode</label><input id="pincode" name="pincode" required></div>
      <div><label for="reg_number">GST / FSSAI number (optional)</label><input id="reg_number" name="reg_number"></div>
    </div>
    <label for="scheme">Certification scheme</label>
    <select id="scheme" name="scheme" required>
      <option>Product Manufacturer</option>
      <option>Food Premises (Restaurant / Caterer)</option>
      <option>Outlet / Hotel</option>
      <option>Abattoir / Slaughterhouse</option>
    </select>
    <label for="products">Products or services to be certified</label>
    <textarea id="products" name="products" rows="3" required></textarea>
    <div id="apply-msg" class="alert error hidden" role="alert"></div>
    <p><button class="btn" type="submit">Submit application</button></p>
  </form>
</div>
</main>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/apply.js"></script>
</body>
</html>
