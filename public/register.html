<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Halal Rizq Khidmaat LLP</title>
<meta name="description" content="Create an account to apply for Halal certification.">
<link rel="icon" href="/images/logo.jpeg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="panel">
  <h1>Create your account</h1>
  <form id="auth-form" data-endpoint="/api/auth/register">
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel">
    <label for="password">Password (8 or more characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <div id="auth-msg" class="alert error hidden" role="alert"></div>
    <p><button class="btn" type="submit">Create account</button></p>
  </form>
  <p>Already registered? <a href="/login">Log in</a></p>
</div>
</main>
<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
